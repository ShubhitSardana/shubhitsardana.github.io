<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b18" />
      <stop offset="100%" stop-color="#0d0d0c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Circular Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Gravitational Wave Ripples (Concentric Curved Spacetime Distortions) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.45" />
  <circle cx="32" cy="32" r="11" fill="none" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Pulsar Center Glow -->
  <circle cx="32" cy="32" r="9" fill="url(#glow)" />

  <!-- Pulsar Core Star / Beams -->
  <g filter="url(#shadow)">
    <!-- Vertical and Horizontal Beams -->
    <path d="M32 18 L33.5 28 L43.5 29.5 L34.5 32 L43.5 34.5 L33.5 36 L32 46 L30.5 36 L20.5 34.5 L29.5 32 L20.5 29.5 L30.5 28 Z" fill="url(#goldGrad)" />
    <!-- Bright Core -->
    <circle cx="32" cy="32" r="2.8" fill="#ffffff" />
  </g>
</svg>
